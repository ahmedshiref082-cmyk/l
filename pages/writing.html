
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعلم الكتابة | مغامرات الحروف</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #f3f7ff;
            color: #26334a;
            margin: 0;
        }

        .writing-page {
            max-width: 900px;
            margin: auto;
            padding: 30px 18px;
        }

        .back-button {
            display: inline-block;
            background: #5546d8;
            color: white;
            padding: 12px 22px;
            border-radius: 13px;
            text-decoration: none;
            font-weight: bold;
        }

        .heading {
            text-align: center;
            margin: 30px 0;
        }

        .heading h1 {
            color: #5546d8;
            font-size: 36px;
        }

        .writing-card {
            background: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 5px 20px #26334a12;
            text-align: center;
        }

        .letter-select {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .letter-select button {
            background: #eef0ff;
            color: #5546d8;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 9px 15px;
            font-size: 25px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .letter-select button.active {
            background: #5546d8;
            color: white;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            margin: 20px auto;
            border: 3px dashed #b7b9ef;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 300px;
            touch-action: none;
            cursor: crosshair;
        }

        .guide {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 190px;
            font-weight: 900;
            color: #e9e9f5;
            pointer-events: none;
            user-select: none;
        }

        .tools {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .tools button {
            border: 0;
            border-radius: 13px;
            padding: 12px 22px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .clear-button {
            background: #ffe8e8;
            color: #d34b4b;
        }

        .done-button {
            background: #16a879;
            color: white;
        }

        .message {
            min-height: 30px;
            color: #16a879;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<main class="writing-page">

    <a href="../index.html" class="back-button">← العودة للرئيسية</a>

    <header class="heading">
        <h1>✍️ مدرسة الكتابة</h1>
        <p>اختر حرفًا وتدرّب على رسمه بنفسك!</p>
    </header>

    <section class="writing-card">

        <h2 id="selectedTitle">اختر الحرف الذي تريد كتابته</h2>

        <div class="letter-select" id="letterSelect"></div>

        <p>تتبّع شكل الحرف باستخدام إصبعك أو الماوس.</p>

        <div class="canvas-container">
            <div class="guide" id="guide">أ</div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div class="tools">
            <button class="clear-button" id="clearButton">
                🧹 مسح الرسم
            </button>

            <button class="done-button" id="doneButton">
                ⭐ انتهيت من التدريب
            </button>
        </div>

        <div class="message" id="message"></div>

    </section>

</main>

<script src="../js/main.js"></script>

<script>
    const letters = [
        "أ", "ب", "ت", "ث", "ج", "ح", "خ",
        "د", "ذ", "ر", "ز", "س", "ش", "ص",
        "ض", "ط", "ظ", "ع", "غ", "ف", "ق",
        "ك", "ل", "م", "ن", "هـ", "و", "ي"
    ];

    const canvas = document.getElementById("drawingCanvas");
    const ctx = canvas.getContext("2d");

    const guide = document.getElementById("guide");
    const letterSelect = document.getElementById("letterSelect");
    const selectedTitle = document.getElementById("selectedTitle");
    const message = document.getElementById("message");

    let selectedLetter = "أ";
    let drawing = false;

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();

        const savedImage = document.createElement("canvas");
        savedImage.width = canvas.width;
        savedImage.height = canvas.height;

        if (canvas.width && canvas.height) {
            savedImage.getContext("2d").drawImage(canvas, 0, 0);
        }

        canvas.width = rect.width;
        canvas.height = 300;

        ctx.lineWidth = 8;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#5546d8";

        if (savedImage.width && savedImage.height) {
            ctx.drawImage(
                savedImage,
                0, 0, savedImage.width, savedImage.height,
                0, 0, canvas.width, canvas.height
            );
        }
    }

    function createLetterButtons() {
        letters.forEach(letter => {
            const button = document.createElement("button");

            button.textContent = letter;

            if (letter === selectedLetter) {
                button.classList.add("active");
            }

            button.addEventListener("click", () => {
                selectedLetter = letter;

                guide.textContent = letter;
                selectedTitle.textContent = `تدرّب على كتابة حرف ${letter}`;
                message.textContent = "";

                document.querySelectorAll(".letter-select button")
                    .forEach(item => item.classList.remove("active"));

                button.classList.add("active");

                clearCanvas();
            });

            letterSelect.appendChild(button);
        });
    }

    function getPosition(event) {
        const rect = canvas.getBoundingClientRect();

        return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top
        };
    }

    canvas.addEventListener("pointerdown", event => {
        drawing = true;
        canvas.setPointerCapture(event.pointerId);

        const position = getPosition(event);

        ctx.beginPath();
        ctx.moveTo(position.x, position.y);
        ctx.lineTo(position.x + 0.1, position.y + 0.1);
        ctx.stroke();
    });

    canvas.addEventListener("pointermove", event => {
        if (!drawing) return;

        const position = getPosition(event);

        ctx.lineTo(position.x, position.y);
        ctx.stroke();
    });

    function stopDrawing() {
        drawing = false;
        ctx.beginPath();
    }

    canvas.addEventListener("pointerup", stopDrawing);
    canvas.addEventListener("pointercancel", stopDrawing);
    canvas.addEventListener("lostpointercapture", stopDrawing);

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        message.textContent = "";
    }

    document.getElementById("clearButton").addEventListener("click", clearCanvas);

    document.getElementById("doneButton").addEventListener("click", () => {
        window.AdventureApp?.completeLesson("writing-" + selectedLetter);

        message.textContent = "🎉 أحسنت! واصل التدريب على الحروف.";
    });

    createLetterButtons();
    resizeCanvas();

    window.addEventListener("resize", resizeCanvas);

    selectedTitle.textContent = "تدرّب على كتابة حرف أ";
</script>

</body>
</html>
